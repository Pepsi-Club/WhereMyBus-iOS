name: PullRequestTest

on:
  pull_request:
    branches:
      - dev
      
jobs:
  build_test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v2

      - name: Bring ignored files
        uses: actions/checkout@v3
        with:
          repository: Pepsi-Club/WhereMyBus-ignored
          path: XCConfig/
          token: ${{ secrets.ACTION_TOKEN }}
                    
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.3"
          
      - name: Setup Swift Version
        uses: swift-actions/setup-swift@v2
        with:
            swift-version: "5.10"
        
      - name: Get swift version
        run: swift --version
                    
      - name: Mise
        use: jdx/mise-action@v2

      - name: Install Tuist
        run: mise install tuist@$4.33.0
 
      - name: Tuist version
        run: mise use -g tuist@4.33.0
        
      - name: Setup Project
        run: make init
                
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Tuist Build Test
        run: tuist build App
